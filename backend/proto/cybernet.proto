syntax = "proto3";

package cybernet.lab;

option go_package = "github.com/cybernet/lab/proto";

service LabService {
  rpc GetDeviceInfo(DeviceRequest) returns (DeviceResponse);
  rpc GetLabState(LabStateRequest) returns (LabStateResponse);
  rpc ExecuteCommand(CommandRequest) returns (CommandResponse);
  rpc InjectError(ErrorInjectionRequest) returns (ErrorInjectionResponse);
}

service TelemetryService {
  rpc Stream(TelemetryRequest) returns (stream TelemetryUpdate);
}

message DeviceRequest {
  string device_id = 1;
}

message DeviceResponse {
  DeviceInfo device = 1;
  DeviceState state = 2;
}

message DeviceInfo {
  string id = 1;
  string type = 2;
  string name = 3;
  string ip = 4;
  int32 interfaces = 5;
}

message DeviceState {
  string status = 1;
  float cpu = 2;
  float memory = 3;
  float temperature = 4;
  int64 last_update = 5;
}

message LabStateRequest {}

message LabStateResponse {
  int32 active_sessions = 1;
  int32 devices = 2;
  repeated LabSession sessions = 3;
}

message LabSession {
  int64 id = 1;
  string lab_id = 2;
  string user_id = 3;
  int64 started_at = 4;
  int64 completed_at = 5;
  string status = 6;
}

message CommandRequest {
  string device_id = 1;
  string command = 2;
}

message CommandResponse {
  string device_id = 1;
  string command = 2;
  string output = 3;
  int64 timestamp = 4;
}

message ErrorInjectionRequest {
  string lab_id = 1;
  string error_type = 2;
}

message ErrorInjectionResponse {
  string lab_id = 1;
  string error_type = 2;
  int64 injected_at = 3;
}

message TelemetryRequest {}

message TelemetryUpdate {
  int64 timestamp = 1;
  repeated DeviceTelemetry devices = 2;
}

message DeviceTelemetry {
  string id = 1;
  float cpu = 2;
  float memory = 3;
  float temperature = 4;
  InterfaceStats interface_stats = 5;
}

message InterfaceStats {
  int64 in_packets = 1;
  int64 out_packets = 2;
  int64 errors = 3;
  int64 drops = 4;
}
