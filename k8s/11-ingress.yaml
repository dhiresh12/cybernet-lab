apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cybernet-ingress
  namespace: cybernet-lab
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/websocket-services: "cybernet-backend"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
  - host: cybernet-lab.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cybernet-backend
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: cybernet-backend
            port:
              number: 80
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: cybernet-backend
            port:
              number: 80
  tls:
  - hosts:
    - cybernet-lab.example.com
    secretName: cybernet-tls
