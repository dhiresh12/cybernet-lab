apiVersion: v1
kind: Secret
metadata:
  name: cybernet-secrets
  namespace: cybernet-lab
  labels:
    app: cybernet-backend
type: Opaque
# WARNING: For production, create this secret with:
#   kubectl create secret generic cybernet-secrets \
#     --from-literal=db-user=cybernet \
#     --from-literal=db-password="$(openssl rand -base64 32)" \
#     --from-literal=db-name=cybernet_lab \
#     --from-literal=jwt-secret="$(openssl rand -base64 48)"
# Do NOT commit real secrets to version control.
stringData:
  db-user: "cybernet"
  db-password: "CHANGE_ME_POSTGRES_PASSWORD"
  db-name: "cybernet_lab"
  jwt-secret: "CHANGE_ME_JWT_SECRET_64_CHARS_MINIMUM_LENGTH_FOR_PRODUCTION_USE"
