apiVersion: apps/v1
kind: Deployment
metadata:
  name: cybernet-backend
  namespace: cybernet-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cybernet-backend
  template:
    metadata:
      labels:
        app: cybernet-backend
    spec:
      containers:
      - name: backend
        image: cybernet-lab/backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        - containerPort: 50051
          name: grpc
        env:
        - name: NODE_ENV
          value: "production"
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "cybernet_lab"
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: PORT
          value: "3000"
        - name: GRPC_PORT
          value: "50051"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
