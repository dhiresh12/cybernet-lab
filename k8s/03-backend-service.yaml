apiVersion: v1
kind: Service
metadata:
  name: cybernet-backend
  namespace: cybernet-lab
  labels:
    app: cybernet-backend
spec:
  selector:
    app: cybernet-backend
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  - name: grpc
    port: 50051
    targetPort: 50051
    protocol: TCP
  type: ClusterIP
