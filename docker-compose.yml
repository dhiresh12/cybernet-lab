version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cybernet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cybernet_lab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cybernet

  redis:
    image: redis:7-alpine
    container_name: cybernet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cybernet

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cybernet-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "50051:50051"
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cybernet_lab
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3000
      GRPC_PORT: 50051
    depends_on:
      - postgres
      - redis
    networks:
      - cybernet

volumes:
  postgres_data:
  redis_data:

networks:
  cybernet:
    driver: bridge
